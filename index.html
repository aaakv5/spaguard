<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Определение местоположения</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container { text-align: center; padding: 20px; }
        .spinner {
            border: 4px solid var(--tg-theme-hint-color, #f3f3f3);
            border-top: 4px solid var(--tg-theme-button-color, #2481cc);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Определяем...</p>
        <p id="status" style="font-size: 12px; opacity: 0.7;"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function getIPAndSend() {
            const statusEl = document.getElementById('status');
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ip = data.ip;

                statusEl.textContent = `IP: ${ip}`;
              
                tg.sendData(JSON.stringify({ web_app_ip: ip }));

                setTimeout(() => tg.close(), 1500);
            } catch (error) {
                statusEl.textContent = 'Не удалось определить. Попробуйте ещё раз.';
                console.error('IP fetch error:', error);
            }
        }

        getIPAndSend();
    </script>
</body>
</html>
